<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/OldShit/css/package.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="row">
        <div class="column">
            <img class="FullPackage" src="/OldShit/images/fullPackage.jpg" alt="FullPackage">
            <p class="packageText">Komplet Dykkerudstyr</p>
            <p class="packageText">400 Kr</p>
            <button class="buttons">Tilføj til Kurv</button>
        </div>
        <div class="column">

            <p class="packageText">200 Kr</p>
            <button class="buttons">Tilføj til Kurv</button>
        </div>
        <div class="column">

            <p class="packageText">BCD Pakke</p>

            <button class="buttons">Tilføj til Kurv</button>
