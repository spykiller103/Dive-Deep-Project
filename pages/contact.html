<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/contact.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
</head>

<body>
    <h1 id="contact">Kontakt</h1>
    <p id="contacttext">Kontakt os via denne kontaktformular</p>

    <h2 id="contactformula">Kort kontaktformular</h2>

    <div id="emailContainer">

        <div class="emailField">
            <label for="emialInput">Email</label>
            <input type="email" class="form-control" id="emialInput" placeholder="name@example.com">
        </div>

        <div class="emailField">
            <label for="confirmEmail">Confirm Email</label>
            <input type="email" class="form-control" id="confirmEmail">
        </div>

    </div>
    <div class="mb-3">
        <label for="exampleFormControlTextarea1" class="form-label">Besked</label>
        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
    </div>

    <button type="button" class="btn btn-primary">Kontakts os</button>

</body>

</html>
